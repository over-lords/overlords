    <title>Overlords</title>
    <style>
        #infoBox {
            position: fixed;
            right: 10px;
            bottom: 4px;
            height: 105px;
            width: 290px;
            background-color: rgba(0,0,0,0.8);
            border: 2px solid #ffffff55;
            border-radius: 10px;
            box-shadow: 0 0 12px black;
            color: white;
            font-family: sans-serif;
            z-index: 999;
            display: flex;
            flex-direction: column;
        }
        .tabs {
            display: flex;
            background-color: #444;
            border-bottom: 1px solid #444;
            border-radius: 10px;
        }
        .tab-button {
            flex: 1;
            padding: 5px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            border-radius: 10px;
        }
        .tab-button:hover {
            background-color: #333;
        }
        .tab-button.active {
            background-color: #222;
        }
        .tab-content {
            flex: 1;
            display: none;
            padding: 2px 10px 10px 10px;
            overflow-y: auto;
        }
        .tab-content.active {
            display: block;
        }
        .profilePicCurrent.flash-border {
            outline: 3px solid gold;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.9);
            transition: outline 0.15s ease, box-shadow 0.15s ease;
        }
        .profilePicCurrent.flash-fail {
            outline: 3px solid red;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.9);
            transition: outline 0.15s ease, box-shadow 0.15s ease;
        }
    </style>
    <link rel="manifest" href="manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("service-worker.js")
                    .catch(err => console.error("SW registration failed:", err));
            });
        }
    </script>
</head>
<body style="background-color:white;">

    <div class="main-content">

    <h1 class="glow-red" style="pointer-events: none;">Overlords</h1>

    <div class="rules-box" id="rules-box" onclick="location.href='singlePlayer.html'" style="cursor: pointer;"> <!-- play.html -->
        <h1 class="menu-text" style="margin-top: 0px; pointer-events: none;">Let's Play</h1>

    <div class="deck-box" id="deck-box" onclick="location.href='deckList.html'" style="cursor: pointer;">
        <h1 class="menu-text" style="margin-top: 0px; pointer-events: none;">Character Roster</h1>

    <div class="play-box" id="play-box" onclick="location.href='rules.html'" style="cursor: pointer;">

    <div class="logout-box" id="logout-box" onclick="logoutUser()" style="cursor: pointer;">
        <h1 class="small-menu-text" style="margin-top: 0px; pointer-events: none;">Logout</h1>

        <h1 class="small-menu-text" style="margin-top: 0px; pointer-events: none;">Install Overlords</h1>
    </div>

        <div id="infoBox">
            <div class="tabs">
                <button class="tab-button active" onclick="showTab('news')" style="color: white; font-weight: bold; font-family: 'Poppins', sans-serif; font-style: italic; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;">News and Updates</button>

                style="font-size: 1.1rem; text-align: center; color: white; font-weight: bold; font-family: 'Poppins', sans-serif; font-style: italic; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; cursor: pointer;">

                style="font-size: 0.85rem; 
                        text-align: center;

                        font-weight: bold;

                        font-style: italic; 
                        text-shadow: -2px -2px 0 #000, 
                                    2px -2px 0 #000, 
                                    -2px 2px 0 #000, 
                                    2px 2px 0 #000;
                        user-select: none; 
                        cursor: pointer;">
                Confirm
            </div>

            <div class="profilePicList" id="profilePicList"></div>
        </div>
    </div>

    <script src="./data/news.js"></script>

    <script type="module">
        import { getSessionUserId, clearSessionUserId } from "./utils/session.js";
        const uid = getSessionUserId();
        if (!uid) {
            window.location = "login.html";
        }

        function logoutUser() {
            clearSessionUserId();
            window.location = "login.html";
        }
        window.logoutUser = logoutUser;

        function populateInfo() {
            const newsDiv = document.getElementById('news');
            const issuesDiv = document.getElementById('issues');

            if (Array.isArray(newsData)) {
                newsDiv.innerHTML = newsData.map(entry => `
                    <p><strong>${entry.date}:</strong> ${entry.text}</p>
                `).join('<br>');
            }

            if (Array.isArray(issueData)) {
                issuesDiv.innerHTML = issueData.map(entry => `
                    <p><strong>${entry.title}</strong><br>${entry.text}</p>
                `).join('<br>');
            }
        }
        function showTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');

            tabs.forEach(tab => tab.classList.remove('active'));
            buttons.forEach(button => button.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }
        window.showTab = showTab;
        document.addEventListener("DOMContentLoaded", populateInfo);
    </script>

    <script type="module">
        import { supabase } from "./supabaseClient.js";

        async function pingSupabase() {
            try {
                // This forces a real SQL SELECT 1, guaranteed to hit Postgres
                const { data, error } = await supabase
                    .from("users")
                    .select("id")
                    .limit(1);

                if (error) console.error("Ping failed:", error);
                else console.log("Ping OK:", data);
            } catch (err) {
                console.error("Ping exception:", err);
            }
        }

        // Fire immediately when this module runs
        pingSupabase();

        const listContainer = document.getElementById("profilePicList");
        const currentDisplay = document.getElementById("profilePicCurrent");
        const confirmBtn = document.getElementById("profilePicConfirm");

        document.getElementById("profilePicTitle").addEventListener("click", toggleProfileDisplay);

        let githubImages = [];
        let unlockedImages = [];
        let selectedFilename = null;

        let showWinrate = false;
        let cachedUserStats = null;

        const PROFILE_FALLBACK_BASE = "https://raw.githubusercontent.com/over-lords/overlords/507ea02c00fd19b0ec351e27f645915fab1094fc/Public/Images/Profile%20Pictures/";
        const UNLOCKABLE_FALLBACK_BASE = "https://raw.githubusercontent.com/over-lords/overlords/507ea02c00fd19b0ec351e27f645915fab1094fc/Public/Images/Unlockable%20Profile%20Pictures/";

        function cacheList(key, list) {
            try { localStorage.setItem(key, JSON.stringify(list)); } catch (_) {}
        }
        function loadCachedList(key) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return [];
                const arr = JSON.parse(raw);
                return Array.isArray(arr) ? arr : [];
            } catch (_) { return []; }
        }

        function buildFallbackList(filenames, base) {
            return (filenames || []).map(name => ({
                filename: name.trim(),
                url: `${base}${encodeURIComponent(name.trim())}`
            }));
        }

        async function loadGitHubImages() {
            const apiUrl = "https://api.github.com/repos/over-lords/overlords/contents/Public/Images/Profile%20Pictures";
            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error(`status ${res.status}`);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error("unexpected payload");

                githubImages = data
                    .filter(item =>
                        item.type === "file" &&
                        item.name.match(/\.(png|jpg|jpeg|gif|webp)$/i)
                    )
                    .map(item => ({
                        filename: item.name.trim(),
                        url: item.download_url
                    }));

                // cache filenames for fallback use
                cacheList("profilePicsCache", githubImages.map(g => g.filename));
            } catch (err) {
                console.warn("GitHub API error (profile pics), using fallback:", err);
                const cached = loadCachedList("profilePicsCache");
                if (cached.length) {
                    githubImages = buildFallbackList(cached, PROFILE_FALLBACK_BASE);
                } else {
                    githubImages = [];
                }
            }
        }

        function renderProfileList() {
            listContainer.innerHTML = "";
            const unlockNames = new Set(unlockedImages.map(u => u.filename.toLowerCase()));
            const sortedUnlocked = [...unlockedImages];
            const sortedBase = [...githubImages]
                .filter(img => !unlockNames.has(img.filename.toLowerCase()))
                .sort((a, b) => a.filename.localeCompare(b.filename));
            const combined = [...sortedUnlocked, ...sortedBase];

            combined.forEach(imgData => {
                const img = document.createElement("img");
                img.src = imgData.url;
                img.alt = imgData.filename;
                if (imgData.isUnlock) {
                    img.style.boxShadow = "0 0 12px rgba(100, 180, 255, 0.8)";
                }

                img.addEventListener("click", () => {
                    document.querySelectorAll(".profilePicList img")
                        .forEach(el => el.classList.remove("selected"));

                    img.classList.add("selected");
                    selectedFilename = imgData.filename;

                    currentDisplay.style.backgroundImage = `url('${imgData.url}')`;
                });

                listContainer.appendChild(img);
            });
        }

        async function loadUserProfile() {
            const uid = localStorage.getItem("session_user_id");
            if (!uid) return;

            const { data: user, error } = await supabase
                .from("users")
                .select("username, profile_picture, wins, games_played, flags")
                .eq("id", uid)
                .single();

            if (error || !user) {
                console.error("Error loading profile:", error);
                return;
            }

            cachedUserStats = {
                username: user.username,
                wins: user.wins ?? 0,
                games_played: user.games_played ?? 0
            };

            const titleBox = document.getElementById("profilePicTitle");
            titleBox.textContent = `Welcome, ${user.username}!`;

            const normalized = user.profile_picture?.trim()?.toLowerCase();

            // Build unlocked list from wins + flags that match unlockable filenames
            unlockedImages = [];
            const flags = Array.isArray(user.flags) ? user.flags.map(String) : [];
            const winsCount = Math.max(0, parseInt(user.wins ?? 0, 10) || 0);
            const unlockableRepoPath = "https://api.github.com/repos/over-lords/overlords/contents/Public/Images/Unlockable%20Profile%20Pictures";
            try {
                const res = await fetch(unlockableRepoPath);
                let files = null;
                if (res.ok) {
                    files = await res.json();
                } else {
                    throw new Error(`status ${res.status}`);
                }
                if (!Array.isArray(files)) throw new Error("unexpected payload");

                const unlockables = files
                    .filter(item => item.type === "file" && item.name.match(/\.(png|jpg|jpeg|gif|webp)$/i))
                    .map(item => ({ filename: item.name.trim(), url: item.download_url }));

                cacheList("unlockablePicsCache", unlockables.map(u => u.filename));

                const unlockedFromWins = [];
                const unlockedFromFlags = [];
                const flagOrder = new Map(flags.map((f, i) => [f.toLowerCase(), i]));

                unlockables.forEach(file => {
                    const baseName = file.filename.replace(/\.(png|jpg|jpeg|gif|webp)$/i, "");
                    const lowerBase = baseName.toLowerCase();
                    const winMatch = baseName.match(/^win(\d+)$/i);

                    if (winMatch) {
                        const winNumber = parseInt(winMatch[1], 10);
                        if (!Number.isNaN(winNumber) && winNumber <= winsCount) {
                            unlockedFromWins.push({ ...file, isUnlock: true, winNumber });
                            return;
                        }
                    }

                    if (flagOrder.has(lowerBase)) {
                        unlockedFromFlags.push({ ...file, isUnlock: true });
                    }
                });

                unlockedFromWins.sort((a, b) => b.winNumber - a.winNumber);

                // Preserve the order of flags (first flag should appear first)
                unlockedFromFlags.sort((a, b) => {
                    const aKey = a.filename.replace(/\.(png|jpg|jpeg|gif|webp)$/i, "").toLowerCase();
                    const bKey = b.filename.replace(/\.(png|jpg|jpeg|gif|webp)$/i, "").toLowerCase();
                    const ai = flagOrder.has(aKey) ? flagOrder.get(aKey) : Number.MAX_SAFE_INTEGER;
                    const bi = flagOrder.has(bKey) ? flagOrder.get(bKey) : Number.MAX_SAFE_INTEGER;
                    return ai - bi;
                });

                const seen = new Set();
                [...unlockedFromWins, ...unlockedFromFlags].forEach(file => {
                    const key = file.filename.toLowerCase();
                    if (seen.has(key)) return;
                    seen.add(key);

                    const { winNumber, ...rest } = file;
                    unlockedImages.push(rest);
                });
            } catch (e) {
                console.warn("Failed to load unlockable profile pictures from API, using fallback", e);
                const cached = loadCachedList("unlockablePicsCache");
                if (cached.length) {
                    const fallbackUnlocks = buildFallbackList(cached, UNLOCKABLE_FALLBACK_BASE);
                    const unlockedFromWins = [];
                    const unlockedFromFlags = [];

                    fallbackUnlocks.forEach(file => {
                        const baseName = file.filename.replace(/\.(png|jpg|jpeg|gif|webp)$/i, "");
                        const lowerBase = baseName.toLowerCase();
                        const winMatch = baseName.match(/^win(\d+)$/i);

                        if (winMatch) {
                            const winNumber = parseInt(winMatch[1], 10);
                            if (!Number.isNaN(winNumber) && winNumber <= winsCount) {
                                unlockedFromWins.push({ ...file, isUnlock: true, winNumber });
                                return;
                            }
                        }

                        if (flagOrder.has(lowerBase)) {
                            unlockedFromFlags.push({ ...file, isUnlock: true });
                        }
                    });

                    unlockedFromWins.sort((a, b) => b.winNumber - a.winNumber);
                    unlockedFromFlags.sort((a, b) => {
                        const aKey = a.filename.replace(/\.(png|jpg|jpeg|gif|webp)$/i, "").toLowerCase();
                        const bKey = b.filename.replace(/\.(png|jpg|jpeg|gif|webp)$/i, "").toLowerCase();
                        const ai = flagOrder.has(aKey) ? flagOrder.get(aKey) : Number.MAX_SAFE_INTEGER;
                        const bi = flagOrder.has(bKey) ? flagOrder.get(bKey) : Number.MAX_SAFE_INTEGER;
                        return ai - bi;
                    });

                    const seen = new Set();
                    [...unlockedFromWins, ...unlockedFromFlags].forEach(file => {
                        const key = file.filename.toLowerCase();
                        if (seen.has(key)) return;
                        seen.add(key);
                        const { winNumber, ...rest } = file;
                        unlockedImages.push(rest);
                    });
                }
            }

            renderProfileList();

            const match = [...unlockedImages, ...githubImages].find(img => img.filename.toLowerCase() === normalized);

            if (match) {
                currentDisplay.style.backgroundImage = `url('${match.url}')`;
                selectedFilename = match.filename;
            }
        }

        async function saveSelectedPicture() {
            const uid = localStorage.getItem("session_user_id");
            if (!uid || !selectedFilename) return;

            const { error } = await supabase
                .from("users")
                .update({ profile_picture: selectedFilename })
                .eq("id", uid);

            if (error) {
                //alert("Error saving profile picture: " + error.message);
                currentDisplay.classList.add("flash-fail");
                setTimeout(() => {
                    currentDisplay.classList.remove("flash-fail");
                }, 1000);
                return;
            }

            //alert("Profile picture updated!");
            currentDisplay.classList.add("flash-border");

            setTimeout(() => {
                currentDisplay.classList.remove("flash-border");
            }, 1000);
        }

        confirmBtn.addEventListener("click", saveSelectedPicture);

        // MASTER LOADER
        async function initProfilePictures() {
            await loadGitHubImages();
            await loadUserProfile();
        }

        initProfilePictures();

        async function toggleProfileDisplay() {
            const titleBox = document.getElementById("profilePicTitle");

            if (!cachedUserStats) return; // safety

            if (!showWinrate) {
                const { wins, games_played } = cachedUserStats;

                let winrate = 0;
                if (games_played > 0) {
                    winrate = Math.round((wins / games_played) * 100);
                }

                titleBox.textContent = `${winrate}% Winrate (${games_played} Games Played)`;
            } else {
                titleBox.textContent = `Welcome, ${cachedUserStats.username}!`;
            }

            showWinrate = !showWinrate;
        }
    </script>

    <script>
        let deferredPrompt = null;
        let sawBeforeInstallPrompt = false;
        const installBox = document.getElementById("install-box");

        function isRunningStandalone() {
            return window.matchMedia("(display-mode: standalone)").matches ||
                window.navigator.standalone === true;
        }

        function showInstallBox() {
            if (isRunningStandalone()) {
                installBox.style.display = "none";
                return;
            }
            installBox.style.display = "block";
        }

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            sawBeforeInstallPrompt = true;
            deferredPrompt = e;
            showInstallBox();
        });

        // Fallback for browsers that don't fire beforeinstallprompt (Safari, Firefox)
        window.addEventListener("load", () => {
            setTimeout(() => {
                if (!sawBeforeInstallPrompt && !isRunningStandalone()) {
                    showInstallBox();
                }
            }, 500);
        });

        installBox.addEventListener("click", async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                installBox.style.display = "none";
                deferredPrompt = null;
                return;
            }

            // Manual instructions for browsers without the event
            const ua = (navigator.userAgent || "").toLowerCase();
            if (ua.includes("safari") && !ua.includes("chrome")) {
                alert("To install on Safari: tap Share, then 'Add to Home Screen'.");
            } else if (ua.includes("firefox")) {
                alert("To install on Firefox: open the menu and choose 'Add to Home Screen'.");
            } else {
                alert("To install, use your browser's 'Add to Home Screen' option.");
            }
        });

        if (isRunningStandalone()) {
            installBox.style.display = "none";
        }
    </script>
